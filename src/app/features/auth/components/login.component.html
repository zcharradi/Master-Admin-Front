<div class="min-h-screen flex">

  <!-- ── Panneau de marque (gauche) ── -->
  <div class="hidden lg:flex lg:w-1/2 xl:w-3/5 relative flex-col items-center justify-center p-12 overflow-hidden"
       style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);">

    <!-- Lumières d'ambiance -->
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-20 blur-3xl"
         style="background: radial-gradient(circle, #6366f1, transparent)"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full opacity-15 blur-3xl"
         style="background: radial-gradient(circle, #818cf8, transparent)"></div>

    <!-- Grille décorative -->
    <div class="absolute inset-0 opacity-5"
         style="background-image: radial-gradient(circle, white 1px, transparent 1px); background-size: 40px 40px;"></div>

    <!-- Contenu central -->
    <div class="relative z-10 max-w-lg text-center">

      <!-- Icône bouclier -->
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-8"
           style="background: rgba(99,102,241,0.15); border: 1px solid rgba(165,180,252,0.25); backdrop-filter: blur(8px);">
        <svg class="w-10 h-10" style="color:#a5b4fc" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>

      <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">Master Admin</h2>
      <p class="text-lg mb-10 leading-relaxed" style="color: rgba(199,210,254,0.75)">
        Plateforme d'administration unifiée et sécurisée pour vos équipes.
      </p>

      <!-- Fonctionnalités -->
      <div class="space-y-4 text-left">
        <div *ngFor="let feat of features" class="flex items-center gap-3" style="color: rgba(199,210,254,0.65)">
          <div class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center"
               style="background: rgba(99,102,241,0.2)">
            <svg class="w-4 h-4" style="color:#818cf8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="feat.icon" />
            </svg>
          </div>
          <span class="text-sm">{{ feat.label }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Panneau formulaire (droite) ── -->
  <div class="flex-1 flex flex-col items-center justify-center p-8 bg-white dark:bg-slate-900">
    <div class="w-full max-w-md">

      <!-- Logo mobile -->
      <div class="flex items-center gap-3 mb-8 lg:hidden">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:#4f46e5">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <span class="text-xl font-bold text-slate-900 dark:text-white">Master Admin</span>
      </div>

      <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Bon retour</h1>
        <p class="text-slate-500 dark:text-slate-400">Connectez-vous à votre espace d'administration</p>
      </div>

      <!-- Compte bloqué -->
      <div *ngIf="accountBlocked$ | async"
           class="mb-6 flex items-center gap-3 p-4 rounded-xl border text-sm font-medium"
           style="background:#fff1f2; border-color:#fecdd3; color:#be123c">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        Compte bloqué. Contactez un administrateur.
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
            Adresse email
          </label>
          <input kendoTextBox formControlName="email" type="email"
                 placeholder="admin@master.io" autocomplete="email" class="w-full" />
        </div>

        <!-- Mot de passe -->
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
            Mot de passe
          </label>
          <div class="relative">
            <input kendoTextBox [type]="showPassword ? 'text' : 'password'"
                   formControlName="password" placeholder="••••••••"
                   autocomplete="current-password" class="w-full" style="padding-right:2.75rem" />
            <button type="button" (click)="showPassword = !showPassword"
                    class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 transition-colors">
              <!-- Oeil ouvert -->
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <!-- Oeil barré -->
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Captcha -->
        <div *ngIf="captchaRequired$ | async">
          <div class="flex items-center gap-2 p-3 rounded-lg border text-sm mb-3"
               style="background:#fffbeb; border-color:#fde68a; color:#92400e">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
            Trop de tentatives — vérification captcha requise.
          </div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
            Code captcha
          </label>
          <input kendoTextBox formControlName="captcha" placeholder="Entrez le code captcha" class="w-full" />
        </div>

        <!-- Erreur -->
        <div *ngIf="(error$ | async) as error"
             class="flex items-center gap-2 p-3 rounded-lg border text-sm"
             style="background:#fff1f2; border-color:#fecdd3; color:#be123c">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
          {{ error }}
        </div>

        <!-- Bouton submit -->
        <button kendoButton type="submit" [primary]="true"
                [disabled]="form.invalid || (!!(loading$ | async)) || (!!(accountBlocked$ | async))"
                class="w-full">
          <span class="flex items-center justify-center gap-2">
            <svg *ngIf="loading$ | async" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 12 0 12 0s0 5.373 0 12h4z"></path>
            </svg>
            {{ (loading$ | async) ? "Connexion en cours..." : "Se connecter" }}
          </span>
        </button>

      </form>
    </div>
  </div>

</div>
