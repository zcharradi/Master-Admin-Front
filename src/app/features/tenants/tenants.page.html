<div class="space-y-4">
  <app-page-header
    title="Tenants"
    subtitle="Multi-tenant management and DB assignment"
    badge="Directory"
    [actions]="actions"
  ></app-page-header>

  @if (gridView$ | async; as grid) {
    <div class="core-grid-container">
      <kendo-grid
        [data]="grid"
        [loading]="(loading$ | async) ?? false"
        [height]="530"
        [pageSize]="gridState.take"
        [skip]="gridState.skip"
        [sort]="gridState.sort"
        [filter]="gridState.filter"
        [sortable]="true"
        [pageable]="true"
        filterable="menu"
        filename="tenants-export"
        [selectable]="selectableSettings"
        kendoGridSelectBy="id"
        [(selectedKeys)]="selectedKeys"
        (selectionChange)="onSelectionChange()"
        (dataStateChange)="onGridStateChange($event)"
      >
        <ng-template kendoGridToolbarTemplate>
          <div class="flex items-center justify-between w-full py-1 custom-toolbar">
            <div class="flex items-center space-x-4">
              <button
                #columnsAnchor
                kendoButton
                look="flat"
                [svgIcon]="columnsIcon"
                class="toolbar-btn-brand"
                (click)="toggleColumnChooser($event)"
              ></button>

              <kendo-popup
                *ngIf="showColumnChooser"
                [anchor]="columnsAnchor"
                [anchorAlign]="{ horizontal: 'left', vertical: 'bottom' }"
                [popupAlign]="{ horizontal: 'left', vertical: 'top' }"
              >
                <div class="column-chooser-panel">
                  <div class="column-chooser-search">
                    <kendo-textbox
                      [(ngModel)]="columnSearch"
                      placeholder="Search"
                      [clearButton]="true"
                    ></kendo-textbox>
                  </div>

                  <div class="column-chooser-list">
                    <label class="column-chooser-item column-chooser-select-all">
                      <input
                        type="checkbox"
                        [checked]="allSelected"
                        (change)="toggleSelectAll()"
                      />
                      <span>Select all</span>
                    </label>

                    <label
                      class="column-chooser-item"
                      *ngFor="let col of filteredColumns"
                    >
                      <input
                        type="checkbox"
                        [checked]="col.visible"
                        (change)="toggleColumn(col)"
                      />
                      <span>{{ col.title }}</span>
                    </label>
                  </div>

                  <div class="column-chooser-footer">
                    <span class="column-chooser-count">{{ selectedCount }} Selected items</span>

                    <div class="column-chooser-actions">
                      <button kendoButton look="flat" [svgIcon]="arrowRotateCwIcon" (click)="resetColumns()">
                        Réinitialiser
                      </button>
                      <button kendoButton [primary]="true" (click)="applyColumns()">
                        Appliquer
                      </button>
                    </div>
                  </div>
                </div>
              </kendo-popup>

              <button
                #exportAnchor
                kendoButton
                look="flat"
                [svgIcon]="downloadIcon"
                class="toolbar-btn-brand font-semibold"
                (click)="toggleExportMenu($event)"
              >
                Export
              </button>

              <kendo-popup
                *ngIf="showExportMenu"
                [anchor]="exportAnchor"
                [anchorAlign]="{ horizontal: 'left', vertical: 'bottom' }"
                [popupAlign]="{ horizontal: 'left', vertical: 'top' }"
              >
                <div class="export-menu-panel">
                  <button class="export-menu-item" (click)="exportExcel()">
                    Excel
                  </button>
                  <button class="export-menu-item" (click)="exportPdf()">
                    PDF
                  </button>
                  <button class="export-menu-item" disabled>
                    Exporter XML
                  </button>
                  <button class="export-menu-item" (click)="importXml(xmlFileInput)">
                    Importer XML
                  </button>
                </div>
              </kendo-popup>

              <input
                #xmlFileInput
                type="file"
                accept=".xml"
                hidden
                (change)="onXmlFileSelected($event)"
              />

              <button
                #selectionAnchor
                kendoButton
                look="flat"
                [svgIcon]="checkboxCheckedIcon"
                class="toolbar-btn-brand font-semibold"
                (click)="toggleSelectionMenu($event)"
              >
                Selection
              </button>

              <kendo-popup
                *ngIf="showSelectionMenu"
                [anchor]="selectionAnchor"
                [anchorAlign]="{ horizontal: 'left', vertical: 'bottom' }"
                [popupAlign]="{ horizontal: 'left', vertical: 'top' }"
              >
                <div class="selection-menu-panel">
                  <button class="selection-menu-item" (click)="selectAllRows()">
                    Sélectionner tout
                  </button>
                  <button class="selection-menu-item" (click)="clearRowSelection()" [disabled]="!hasSelection">
                    Effacer la sélection
                  </button>
                  <button class="selection-menu-item font-semibold" (click)="filterSelectedOnly()" [disabled]="!hasSelection && !isFilteringSelected">
                    {{ isFilteringSelected ? 'Afficher tous les éléments' : 'Afficher uniquement les éléments sélectionnés' }}
                  </button>
                </div>
              </kendo-popup>

              <button kendoButton look="flat" [svgIcon]="arrowRotateCwIcon" (click)="refresh()" class="toolbar-btn-brand font-semibold">
                Update
              </button>

              <button
                #dispositionAnchor
                kendoButton
                look="flat"
                [svgIcon]="gearIcon"
                class="toolbar-btn-brand font-semibold"
                (click)="toggleDispositionMenu($event)"
              >
                Arrangement
              </button>

              <kendo-popup
                *ngIf="showDispositionMenu"
                [anchor]="dispositionAnchor"
                [anchorAlign]="{ horizontal: 'left', vertical: 'bottom' }"
                [popupAlign]="{ horizontal: 'left', vertical: 'top' }"
              >
                <div class="disposition-menu-panel">
                  <button class="disposition-menu-item" (click)="clearAllLayouts()">
                    Supprimer toutes les dispositions
                  </button>
                  <button class="disposition-menu-item" (click)="saveCurrentLayout()">
                    Enregistre la disposition actuelle
                  </button>
                </div>
              </kendo-popup>
            </div>
          </div>
        </ng-template>
        <kendo-grid-checkbox-column
          [width]="45"
          [showSelectAll]="true"
        ></kendo-grid-checkbox-column>

        <kendo-grid-column field="id" title="Id" filter="numeric" [hidden]="!isColumnVisible('id')"></kendo-grid-column>
        <kendo-grid-column field="uuid" title="UUID" filter="text" [hidden]="!isColumnVisible('uuid')"></kendo-grid-column>
        <kendo-grid-column field="entityName" title="Entity" filter="text" [hidden]="!isColumnVisible('entityName')"></kendo-grid-column>
        <kendo-grid-column field="dbLabel" title="DB" filter="text" [hidden]="!isColumnVisible('dbLabel')"></kendo-grid-column>


        <kendo-grid-excel fileName="tenants-export.xlsx"></kendo-grid-excel>
        <kendo-grid-pdf fileName="tenants-export.pdf" [allPages]="true"></kendo-grid-pdf>
      </kendo-grid>
    </div>
  }

  @if (showCreateModal) {
    <kendo-dialog (close)="closeModal()">
      <kendo-dialog-titlebar>New tenant</kendo-dialog-titlebar>

      <form class="space-y-4" [formGroup]="createForm">
        <label class="block text-sm text-theme-primary">
          UUID
          <input kendoTextBox formControlName="uuid" class="mt-1 w-full" />
        </label>

        <label class="block text-sm text-theme-primary">
          Entity name
          <input kendoTextBox formControlName="entityName" class="mt-1 w-full" />
        </label>

        <label class="block text-sm text-theme-primary">
          DB Instance
          <kendo-dropdownlist
            class="mt-1 w-full"
            [data]="dbInstances$ | async"
            textField="name"
            valueField="id"
            [valuePrimitive]="true"
            formControlName="dbInstanceId"
          ></kendo-dropdownlist>
        </label>
      </form>

      <kendo-dialog-actions>
        <button kendoButton look="flat" (click)="closeModal()">Cancel</button>
        <button kendoButton [primary]="true" (click)="create()" [disabled]="createForm.invalid">
          Create
        </button>
      </kendo-dialog-actions>
    </kendo-dialog>
  }
</div>
